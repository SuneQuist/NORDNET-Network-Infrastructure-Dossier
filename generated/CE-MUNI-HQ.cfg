! LOCAL ENTERPRISE: HQ customer edge; migrating Loopback10 onto routed VLAN 10
! This temporarily interrupts the original loopback-based LAN until VLAN 10 is up.
no interface Loopback10
!
interface GigabitEthernet0/1
 description DOT1Q_TO_SW-MUNI-HQ
 no ip address
 no shutdown
 exit
!
interface GigabitEthernet0/1.10
 description VLAN10_STAFF
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group NORD-HQ-STAFF-IN in
 exit
!
interface GigabitEthernet0/1.20
 description VLAN20_ADMIN
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 exit
!
interface GigabitEthernet0/1.30
 description VLAN30_SERVICES
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 exit
!
interface GigabitEthernet0/1.99
 description VLAN99_LOCAL_MGMT
 encapsulation dot1Q 99
 ip address 10.10.99.1 255.255.255.0
 exit
!
ip access-list extended NORD-HQ-STAFF-IN
 deny ip 10.10.10.0 0.0.0.255 10.10.20.0 0.0.0.255 log
 permit ip any any
 exit
!
ip prefix-list PL-CE-HQ-OUT seq 5 permit 10.10.10.0/24
ip prefix-list PL-CE-HQ-OUT seq 10 permit 10.10.20.0/24
ip prefix-list PL-CE-HQ-OUT seq 15 permit 10.10.30.0/24
ip prefix-list PL-CE-HQ-IN seq 5 permit 10.11.10.0/24
ip prefix-list PL-CE-HQ-IN seq 10 permit 10.11.20.0/24
router bgp 65110
 network 10.10.10.0 mask 255.255.255.0
 network 10.10.20.0 mask 255.255.255.0
 network 10.10.30.0 mask 255.255.255.0
 exit
!
service timestamps log datetime msec
logging buffered 32768 informational
