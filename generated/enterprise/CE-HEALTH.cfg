interface GigabitEthernet0/2
 description LOCAL_SERVICE_ONLY_NOT_CUSTOMER_TRANSIT
 ip address 10.30.254.1 255.255.255.252
 no shutdown
 exit
ip route 10.10.30.250 255.255.255.255 10.30.254.2
ip dhcp excluded-address 10.30.10.1 10.30.10.99
ip dhcp pool NORDNET-HEALTH-LAB
 network 10.30.10.0 255.255.255.0
 default-router 10.30.10.1
 dns-server 10.10.30.250
 domain-name nordnet.test
 lease 0 12
 exit
service timestamps log datetime msec
logging buffered 32768 informational
logging trap informational
logging 10.10.30.250
logging source-interface GigabitEthernet0/2
