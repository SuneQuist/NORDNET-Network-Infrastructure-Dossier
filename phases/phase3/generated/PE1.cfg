! PE customer VPN addition: does NOT alter the verified OSPF/LDP core
ip vrf MUNI
 rd 65000:1001
 route-target export 65000:100
 route-target import 65000:100
 exit
!
ip prefix-list PL-MUNI-HQ seq 5 permit 10.10.10.0/24
!
interface GigabitEthernet0/1
 description CE_PE1_CUSTOMER
 ip vrf forwarding MUNI
 ip address 172.21.0.1 255.255.255.252
 no shutdown
 exit
!
router bgp 65000
 bgp router-id 172.20.255.1
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 172.20.255.2 remote-as 65000
 neighbor 172.20.255.2 update-source Loopback0
 address-family vpnv4
  neighbor 172.20.255.2 activate
  neighbor 172.20.255.2 send-community extended
  exit-address-family
 address-family ipv4 vrf MUNI
  neighbor 172.21.0.2 remote-as 65110
  neighbor 172.21.0.2 activate
  neighbor 172.21.0.2 prefix-list PL-MUNI-HQ in
  exit-address-family
 exit
