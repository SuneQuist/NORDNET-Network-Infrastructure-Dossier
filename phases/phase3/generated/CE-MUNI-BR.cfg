! Simulated municipal site LAN via Loopback10 for Phase 3 only
hostname CE-MUNI-BR
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description PROVIDER_EDGE
 ip address 172.21.0.6 255.255.255.252
 no shutdown
 exit
!
interface Loopback10
 description SIMULATED_MUNICIPAL_LAN_PHASE3
 ip address 10.11.10.1 255.255.255.0
 exit
!
ip prefix-list PL-CE-BR-OUT seq 5 permit 10.11.10.0/24
ip prefix-list PL-CE-BR-IN seq 5 permit 10.10.10.0/24
!
router bgp 65111
 bgp router-id 10.11.10.1
 bgp log-neighbor-changes
 neighbor 172.21.0.5 remote-as 65000
 neighbor 172.21.0.5 prefix-list PL-CE-BR-OUT out
 neighbor 172.21.0.5 prefix-list PL-CE-BR-IN in
 network 10.11.10.0 mask 255.255.255.0
 exit
