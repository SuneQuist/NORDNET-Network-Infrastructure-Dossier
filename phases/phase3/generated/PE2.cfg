! PE customer VPN addition: does NOT alter the verified OSPF/LDP core
ip vrf MUNI
 rd 65000:1002
 route-target export 65000:100
 route-target import 65000:100
 exit
!
ip prefix-list PL-MUNI-BR seq 5 permit 10.11.10.0/24
!
interface GigabitEthernet0/1
 description CE_PE2_CUSTOMER
 ip vrf forwarding MUNI
 ip address 172.21.0.5 255.255.255.252
 no shutdown
 exit
!
router bgp 65000
 bgp router-id 172.20.255.2
 bgp log-neighbor-changes
 no bgp default ipv4-unicast
 neighbor 172.20.255.1 remote-as 65000
 neighbor 172.20.255.1 update-source Loopback0
 address-family vpnv4
  neighbor 172.20.255.1 activate
  neighbor 172.20.255.1 send-community extended
  exit-address-family
 address-family ipv4 vrf MUNI
  neighbor 172.21.0.6 remote-as 65111
  neighbor 172.21.0.6 activate
  neighbor 172.21.0.6 prefix-list PL-MUNI-BR in
  exit-address-family
 exit
