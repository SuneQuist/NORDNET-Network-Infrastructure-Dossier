! Phase 4: additive new P2 uplink; preserve MPLS L3VPN/VRF/BGP/old core link
interface GigabitEthernet0/2
 description CORE_TO_P2
 ip address 172.20.0.9 255.255.255.252
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
 no shutdown
 exit
router ospf 100
 no passive-interface GigabitEthernet0/2
 exit
