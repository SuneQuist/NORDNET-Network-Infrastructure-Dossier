! Phase 4: new P2 provider router; OSPF/MPLS only
hostname P2
no ip domain-lookup
ip cef
interface Loopback0
 description PROVIDER_P2_LDP_ROUTER_ID
 ip address 172.20.255.4 255.255.255.255
 ip ospf 100 area 0
 exit
interface GigabitEthernet0/0
 description CORE_TO_PE1
 ip address 172.20.0.10 255.255.255.252
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
 no shutdown
 exit
interface GigabitEthernet0/1
 description CORE_TO_PE2
 ip address 172.20.0.13 255.255.255.252
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 30
 mpls ip
 no shutdown
 exit
router ospf 100
 router-id 172.20.255.4
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 exit
mpls label protocol ldp
mpls ldp router-id Loopback0 force
