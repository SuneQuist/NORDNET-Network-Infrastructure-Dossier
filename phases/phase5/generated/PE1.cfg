! Phase 5: Add isolated UNIV VPN to PE1; do not edit core or MUNI
ip vrf UNIV
 rd 65000:2001
 route-target export 65000:200
 route-target import 65000:200
 exit
!
ip prefix-list PL-UNIV-CE-IN seq 5 permit 10.20.10.0/24
!
interface GigabitEthernet0/3
 description CUSTOMER_UNIV_CE-UNIV
 ip vrf forwarding UNIV
 ip address 172.21.0.9 255.255.255.252
 no shutdown
 exit
!
router bgp 65000
 address-family ipv4 vrf UNIV
  neighbor 172.21.0.10 remote-as 65210
  neighbor 172.21.0.10 activate
  neighbor 172.21.0.10 prefix-list PL-UNIV-CE-IN in
  exit-address-family
 exit
