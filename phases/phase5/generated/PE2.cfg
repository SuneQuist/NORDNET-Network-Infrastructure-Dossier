! Phase 5: Add isolated HEALTH VPN to PE2; do not edit core or MUNI
ip vrf HEALTH
 rd 65000:3002
 route-target export 65000:300
 route-target import 65000:300
 exit
!
ip prefix-list PL-HEALTH-CE-IN seq 5 permit 10.30.10.0/24
!
interface GigabitEthernet0/3
 description CUSTOMER_HEALTH_CE-HEALTH
 ip vrf forwarding HEALTH
 ip address 172.21.0.13 255.255.255.252
 no shutdown
 exit
!
router bgp 65000
 address-family ipv4 vrf HEALTH
  neighbor 172.21.0.14 remote-as 65310
  neighbor 172.21.0.14 activate
  neighbor 172.21.0.14 prefix-list PL-HEALTH-CE-IN in
  exit-address-family
 exit
