! Phase 5: single-site UNIV customer CE, no default route
hostname CE-UNIV
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description TRANSIT_TO_PE1
 ip address 172.21.0.10 255.255.255.252
 no shutdown
 exit
!
interface Loopback10
 description SYNTHETIC_UNIV_LAN_PHASE5
 ip address 10.20.10.1 255.255.255.0
 exit
!
ip prefix-list PL-UNIV-CE-OUT seq 5 permit 10.20.10.0/24
!
! No customer routes should be imported in phase 5.
ip prefix-list PL-UNIV-CE-IN seq 5 deny 0.0.0.0/0 le 32
!
router bgp 65210
 bgp router-id 10.20.10.1
 bgp log-neighbor-changes
 neighbor 172.21.0.9 remote-as 65000
 neighbor 172.21.0.9 prefix-list PL-UNIV-CE-OUT out
 neighbor 172.21.0.9 prefix-list PL-UNIV-CE-IN in
 network 10.20.10.0 mask 255.255.255.0
 exit
