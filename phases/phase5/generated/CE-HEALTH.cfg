! Phase 5: single-site HEALTH customer CE, no default route
hostname CE-HEALTH
no ip domain-lookup
ip cef
!
interface GigabitEthernet0/0
 description TRANSIT_TO_PE2
 ip address 172.21.0.14 255.255.255.252
 no shutdown
 exit
!
interface Loopback10
 description SYNTHETIC_HEALTH_LAN_PHASE5
 ip address 10.30.10.1 255.255.255.0
 exit
!
ip prefix-list PL-HEALTH-CE-OUT seq 5 permit 10.30.10.0/24
!
! No customer routes should be imported in phase 5.
ip prefix-list PL-HEALTH-CE-IN seq 5 deny 0.0.0.0/0 le 32
!
router bgp 65310
 bgp router-id 10.30.10.1
 bgp log-neighbor-changes
 neighbor 172.21.0.13 remote-as 65000
 neighbor 172.21.0.13 prefix-list PL-HEALTH-CE-OUT out
 neighbor 172.21.0.13 prefix-list PL-HEALTH-CE-IN in
 network 10.30.10.0 mask 255.255.255.0
 exit
