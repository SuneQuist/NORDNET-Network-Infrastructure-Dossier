hostname P1
no ip domain-lookup
ip cef
interface Loopback0
 description CORE_ROUTER_ID
 ip address 172.20.255.3 255.255.255.255
 ip ospf 100 area 0
 exit
interface GigabitEthernet0/0
 description CORE_TO_PE1
 ip address 172.20.0.2 255.255.255.252
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
 no shutdown
 exit
interface GigabitEthernet0/1
 description CORE_TO_PE2
 ip address 172.20.0.5 255.255.255.252
 ip ospf 100 area 0
 ip ospf network point-to-point
 ip ospf cost 10
 mpls ip
 no shutdown
 exit
router ospf 100
 router-id 172.20.255.3
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet0/1
 exit
mpls label protocol ldp
mpls ldp router-id Loopback0 force
