project: NORDNET-Core-POC
compute: vm
switch_template: 'Cisco IOSvL2 15.2.1'
# This package targets exactly the verified Phase 5 topology.
# It does not change OSPF, MPLS, VPNv4, VRFs, or PE/CE physical connections.
sites:
  HQ:
    ce: CE-MUNI-HQ
    switch: SW-MUNI-HQ
    trunk_interface: GigabitEthernet0/1
    switch_trunk: GigabitEthernet0/0
    networks:
      - {vlan: 10, name: STAFF, subnet: 10.10.10.0/24, gateway: 10.10.10.1, bgp: true}
      - {vlan: 20, name: ADMIN, subnet: 10.10.20.0/24, gateway: 10.10.20.1, bgp: true}
      - {vlan: 30, name: SERVICES, subnet: 10.10.30.0/24, gateway: 10.10.30.1, bgp: true}
      - {vlan: 99, name: LOCAL_MGMT, subnet: 10.10.99.0/24, gateway: 10.10.99.1, bgp: false}
  BR:
    ce: CE-MUNI-BR
    switch: SW-MUNI-BR
    trunk_interface: GigabitEthernet0/1
    switch_trunk: GigabitEthernet0/0
    networks:
      - {vlan: 10, name: STAFF, subnet: 10.11.10.0/24, gateway: 10.11.10.1, bgp: true}
      - {vlan: 20, name: SERVICES, subnet: 10.11.20.0/24, gateway: 10.11.20.1, bgp: true}
      - {vlan: 99, name: LOCAL_MGMT, subnet: 10.11.99.0/24, gateway: 10.11.99.1, bgp: false}
endpoints:
  - {name: PC-HQ-STAFF, parent: SW-MUNI-HQ, port: GigabitEthernet0/1, ip: 10.10.10.10, gateway: 10.10.10.1, vlan: 10, x: -970, y: -300}
  - {name: PC-HQ-ADMIN, parent: SW-MUNI-HQ, port: GigabitEthernet0/2, ip: 10.10.20.10, gateway: 10.10.20.1, vlan: 20, x: -850, y: -300}
  - {name: PC-HQ-SVC, parent: SW-MUNI-HQ, port: GigabitEthernet0/3, ip: 10.10.30.10, gateway: 10.10.30.1, vlan: 30, x: -730, y: -300}
  - {name: PC-BR-STAFF, parent: SW-MUNI-BR, port: GigabitEthernet0/1, ip: 10.11.10.10, gateway: 10.11.10.1, vlan: 10, x: 450, y: 440}
  - {name: PC-BR-SVC, parent: SW-MUNI-BR, port: GigabitEthernet0/2, ip: 10.11.20.10, gateway: 10.11.20.1, vlan: 20, x: 570, y: 440}
  - {name: PC-UNIV, parent: CE-UNIV, port: GigabitEthernet0/1, ip: 10.20.10.10, gateway: 10.20.10.1, vlan: null, x: -760, y: -450}
  - {name: PC-HEALTH, parent: CE-HEALTH, port: GigabitEthernet0/1, ip: 10.30.10.10, gateway: 10.30.10.1, vlan: null, x: 750, y: -450}
# New node locations on GNS3 canvas
switch_positions:
  SW-MUNI-HQ: [-880, -150]
  SW-MUNI-BR: [480, 300]
